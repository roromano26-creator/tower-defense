name: Unity – Demander le fichier d'activation (à lancer une seule fois)

# Étape préalable unique pour obtenir le secret UNITY_LICENSE.
# Volontairement manuel : ce workflow ne construit rien, il produit seulement le
# fichier .alf à déposer sur license.unity3d.com/manual pour recevoir le .ulf.
#
# L'action game-ci/unity-request-activation-file qui faisait ce travail a été
# retirée et échoue désormais en six secondes. On appelle donc directement
# l'image Unity, ce qu'elle faisait elle-même : rien à installer en local,
# tout se passe dans le conteneur.
on:
  workflow_dispatch:

jobs:
  activation:
    name: Produire le fichier .alf
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Lire la version d'Unity du projet
        id: unity
        run: |
          version=$(grep '^m_EditorVersion:' ProjectSettings/ProjectVersion.txt | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version du projet : $version"

      - name: Créer le fichier d'activation
        run: |
          # -createManualActivationFile sort volontairement avec un code non nul :
          # Unity considère qu'il n'a pas pu démarrer faute de licence, ce qui est
          # exactement la situation. C'est le fichier produit qui fait foi, pas le
          # code de sortie, d'où le || true suivi d'une vérification explicite.
          docker run --rm -v "$PWD:/work" -w /work \
            "unityci/editor:ubuntu-${{ steps.unity.outputs.version }}-base-3" \
            unity-editor -logFile /dev/stdout -batchmode -nographics -quit \
            -createManualActivationFile || true

          sudo chown -R "$USER" .
          if ! ls *.alf >/dev/null 2>&1; then
            echo "::error::Aucun fichier .alf produit. Voir le journal Unity ci-dessus."
            exit 1
          fi
          ls -l *.alf

      - uses: actions/upload-artifact@v4
        with:
          name: licence-unity-alf
          path: "*.alf"
          if-no-files-found: error
          retention-days: 1

      - run: |
          {
            echo "### Fichier d'activation prêt"
            echo ""
            echo "1. Téléchargez l'artefact **licence-unity-alf** ci-dessous et décompressez-le."
            echo "2. Déposez le fichier \`.alf\` sur https://license.unity3d.com/manual"
            echo "3. Choisissez **Unity Personal**, puis *Personal Edition*."
            echo "4. Vous recevez un fichier \`.ulf\` : copiez **tout son contenu** dans le secret \`UNITY_LICENSE\`."
          } >> "$GITHUB_STEP_SUMMARY"
