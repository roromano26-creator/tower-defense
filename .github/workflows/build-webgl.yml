name: Bastion – WebGL navigateur

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: webgl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-webgl:
    name: Construire le WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 120

    # Publier sur GitHub Pages demande d'écrire dans Pages et de signer la
    # provenance du dépôt ; sans ces deux droits l'étape de déploiement est
    # refusée. contents reste en lecture seule, rien n'est écrit dans le dépôt.
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Vérifier que les identifiants Unity sont configurés
        run: |
          if [ -z "${{ secrets.UNITY_EMAIL }}" ] || [ -z "${{ secrets.UNITY_PASSWORD }}" ]; then
            echo "::error::Les secrets UNITY_EMAIL et UNITY_PASSWORD sont requis. Voir CI_CD_SETUP.md, étape 1."
            exit 1
          fi

      - name: Cache de la bibliothèque Unity
        uses: actions/cache@v4
        with:
          path: Library
          key: td-library-webgl-${{ hashFiles('Packages/manifest.json') }}-${{ github.sha }}
          restore-keys: |
            td-library-webgl-${{ hashFiles('Packages/manifest.json') }}-
            td-library-webgl-

      - name: Construire avec Unity
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: WebGL
          buildMethod: Bastion.EditorTools.WebGLBuildSettings.CIBuildWebGL
          versioning: None
          allowDirtyBuild: true
          manualExit: true
          # Version figée plutôt que « latest » : résoudre la dernière version
          # demande un appel à l'API GitHub, qui a déjà répondu 403 en limite de
          # débit après plusieurs constructions rapprochées, faisant échouer le
          # build avant même de lancer Unity. Une version fixe supprime l'appel,
          # et rend au passage la construction reproductible.
          cliVersion: v0.1.69

      # GameCI construit dans un conteneur : les fichiers appartiennent à root et
      # les étapes suivantes ne pourraient ni les lire ni les téléverser.
      - name: Rendre la sortie lisible
        if: success()
        run: sudo chown -R "$USER" Builds

      - name: Diagnostic TextMeshPro
        if: always()
        run: |
          echo "--- lignes [TMP] du journal Unity ---"
          grep -h "\[TMP\]" *.log Logs/*.log 2>/dev/null \
            || echo "(aucune ligne [TMP] : la génération n'a pas atteint cette étape)"

      - name: Publier le WebGL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bastion-webgl
          path: Builds/WebGL
          if-no-files-found: error
          retention-days: 30

      # ── Mise en ligne sur GitHub Pages ────────────────────────────────────
      # Voie principale : hébergée par GitHub, sans compte tiers, sans jeton ni
      # identifiant à recopier. enablement active Pages sur le dépôt au premier
      # passage, il n'y a donc rien à cocher dans les réglages.
      # Les fichiers Brotli sont servis tels quels, sans en-tête d'encodage, ce
      # qui est exactement ce qu'attend le décompresseur JavaScript d'Unity.
      - name: Préparer GitHub Pages
        if: success()
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaqueter le jeu pour Pages
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: Builds/WebGL

      - name: Déployer sur GitHub Pages
        id: pages
        if: success()
        uses: actions/deploy-pages@v4

      - name: Annoncer l'adresse de jeu
        if: success()
        run: |
          {
            echo "### Bastion est jouable"
            echo ""
            echo "${{ steps.pages.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Jouable ici : ${{ steps.pages.outputs.page_url }}"

      # Vercel est désormais secondaire : GitHub Pages met déjà le jeu en ligne.
      # continue-on-error pour cette raison — un jeton expiré ou une erreur de
      # configuration côté Vercel ne doit plus faire échouer une construction
      # par ailleurs réussie, ni masquer l'adresse Pages.
      - name: Déployer sur Vercel (optionnel)
        continue-on-error: true
        if: success() && github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # VERCEL_ORG_ID et VERCEL_PROJECT_ID ne sont volontairement pas transmis.
          # Recopiés à la main depuis deux pages différentes de Vercel, une seule
          # valeur erronée suffisait à produire « Project not found » sans dire
          # laquelle des deux. Le projet est désormais lié par son nom, qui se
          # vérifie d'un coup d'œil. S'ils sont présents dans l'environnement, le
          # client les préfère au lien et l'erreur reviendrait.
          # Le conteneur Unity tourne en root et laisse sous /home/runner des dossiers
          # qui lui appartiennent. Le client Vercel, lancé ensuite par l'utilisateur
          # normal, ne peut alors plus créer les siens et meurt sur EACCES avant
          # d'avoir rien déployé. On lui en attribue donc ailleurs, dans un
          # emplacement qui nous appartient à coup sûr.
          XDG_DATA_HOME: ${{ runner.temp }}/vercel-data
          XDG_CACHE_HOME: ${{ runner.temp }}/vercel-cache
        run: |
          # pipefail : sans lui, un échec de vercel serait masqué par le tee qui suit
          # et l'étape passerait au vert sans avoir rien déployé.
          set -o pipefail
          mkdir -p "$XDG_DATA_HOME" "$XDG_CACHE_HOME"

          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Secret VERCEL_TOKEN absent."
            echo "Déploiement ignoré. L'artefact bastion-webgl reste téléchargeable."
            echo "Marche à suivre : CI_CD_SETUP.md, section Vercel."
            exit 0
          fi

          # Lie le dossier au projet nommé tower-defense, et le crée s'il n'existe
          # pas encore. Le jeton est donc le seul secret nécessaire.
          npx --yes vercel@latest link --yes --project tower-defense \
            --cwd Builds/WebGL --token "$VERCEL_TOKEN"

          # Aucun en-tête Content-Encoding n'est posé sur les fichiers .br, et c'est
          # délibéré. Le build active decompressionFallback : c'est le décompresseur
          # JavaScript d'Unity qui lit ces fichiers. Annoncer « br » au navigateur le
          # ferait décompresser en amont, et le décompresseur d'Unity recevrait des
          # données déjà en clair qu'il ne saurait pas relire. Ne pas « corriger »
          # cela en ajoutant un vercel.json d'en-têtes.
          npx --yes vercel@latest deploy --prod --yes \
            --cwd Builds/WebGL --token "$VERCEL_TOKEN" | tee sortie-vercel.txt

          url=$(grep -oE 'https://[A-Za-z0-9._-]+\.vercel\.app' sortie-vercel.txt | tail -n1)
          if [ -z "$url" ]; then
            echo "::error::Déploiement terminé sans adresse exploitable. Voir la sortie ci-dessus."
            exit 1
          fi
          echo "Jouable ici : $url"
          {
            echo "### Bastion est jouable"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le journal en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journal-unity-webgl
          path: |
            *.log
            Logs/**
          if-no-files-found: ignore
          retention-days: 7
