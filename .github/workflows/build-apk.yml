name: Bastion – APK Android

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: siege-unity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Construire l'APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Sans licence, GameCI échoue au bout de plusieurs minutes sur un message obscur.
      # Autant le dire tout de suite, en nommant le secret manquant.
      - name: Vérifier que les identifiants Unity sont configurés
        run: |
          if [ -z "${{ secrets.UNITY_EMAIL }}" ] || [ -z "${{ secrets.UNITY_PASSWORD }}" ]; then
            echo "::error::Les secrets UNITY_EMAIL et UNITY_PASSWORD sont requis. Voir CI_CD_SETUP.md, étape 1."
            exit 1
          fi

      # La bibliothèque Unity (import des assets) représente l'essentiel du temps de la
      # première exécution ; la garder en cache ramène les suivantes à quelques minutes.
      - name: Cache de la bibliothèque Unity
        uses: actions/cache@v4
        with:
          path: Library
          key: td-library-android-${{ hashFiles('Packages/manifest.json') }}-${{ github.sha }}
          restore-keys: |
            td-library-android-${{ hashFiles('Packages/manifest.json') }}-
            td-library-android-

      - name: Construire avec Unity
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: Android
          buildMethod: Bastion.EditorTools.AndroidBuildSettings.CIBuildApk
          androidTargetSdkVersion: 35
          # Version figée plutôt que « latest » : résoudre la dernière version
          # demande un appel à l'API GitHub, qui répond 403 en limite de débit
          # après plusieurs constructions rapprochées, faisant échouer le build
          # avant même de lancer Unity.
          cliVersion: v0.1.69
          versioning: None
          allowDirtyBuild: true
          manualExit: true

      - name: Rendre la sortie lisible
        if: success()
        run: sudo chown -R "$USER" Builds

      - name: Diagnostic TextMeshPro
        if: always()
        run: |
          echo "--- lignes [TMP] du journal Unity ---"
          grep -h "\[TMP\]" *.log Logs/*.log 2>/dev/null \
            || echo "(aucune ligne [TMP] : la génération n'a pas atteint cette étape)"

      - name: Publier l'APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bastion-apk
          path: Builds/Bastion.apk
          if-no-files-found: error
          retention-days: 30

      # Le journal Unity est la seule trace exploitable quand la construction échoue.
      - name: Publier le journal en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journal-unity-android
          path: |
            *.log
            Logs/**
          if-no-files-found: ignore
          retention-days: 7
